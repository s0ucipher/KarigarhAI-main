<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KalaSetu AI - Artisan Marketplace</title>
  <meta name="description" content="AI-Powered mobile marketplace connecting rural Indian craftsmen with conscious buyers.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏺</text></svg>">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: {
              750: '#A14E1B',
              850: '#6C2E0C',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/styles.css?v=2.1.0">
</head>
<body class="min-h-screen bg-stone-100 flex flex-col">

  <!-- Top Simulator Control Header (Visible on Desktop only) -->
  <header id="simulator-header" class="hidden md:flex bg-stone-900 text-stone-300 px-4 py-2 text-xs items-center justify-between border-b border-stone-800 z-50">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="font-bold text-white">KalaSetu AI Marketplace</span>
      <span class="text-stone-400 hidden lg:inline">• Empowering Traditional Artisans</span>
    </div>

    <!-- Desktop | Mobile View Mode Selector -->
    <div class="flex items-center bg-stone-800 rounded-lg p-0.5 border border-stone-700">
      <button id="btn-view-desktop" class="px-3 py-1 rounded-md font-bold transition flex items-center gap-1.5 bg-amber-700 text-white shadow-xs" title="Natural Desktop View">
        <i class="fa-solid fa-desktop"></i>
        <span>Desktop</span>
      </button>
      <button id="btn-view-mobile" class="px-3 py-1 rounded-md font-bold transition flex items-center gap-1.5 text-stone-300 hover:text-white" title="Mobile Simulator Preview">
        <i class="fa-solid fa-mobile-screen"></i>
        <span>Mobile</span>
      </button>
      <!-- Backward compatible hidden button for existing triggers -->
      <button id="btn-toggle-frame" class="hidden" aria-hidden="true"></button>
    </div>
  </header>

  <!-- Main Application Container (Defaults to Natural Viewport) -->
  <div id="phone-frame-wrapper" class="w-full bg-white flex-1 flex flex-col">
    <!-- Phone Notch (For iPhone simulator effect) -->
    <div class="phone-notch"></div>

    <!-- App Top Bar (Sticky header with Logo, Role toggle, Language, Notifications) -->
    <header id="app-topbar" class="shrink-0 z-40"></header>

    <!-- Dynamic Screen Container -->
    <main id="screen-container" class="flex-1 overflow-y-auto bg-[#FAF8F5] relative"></main>

    <!-- Bottom Navigation Bar (Sticky mobile bottom tabs) -->
    <nav id="app-bottom-nav" class="shrink-0 sticky bottom-0 z-40 bg-white/95"></nav>
  </div>

  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-20 inset-x-0 z-50 flex flex-col items-center gap-2 pointer-events-none px-4"></div>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <!-- Scripts -->
  <script src="/js/i18n.js?v=2.3.0"></script>
  <script src="/js/api.js?v=2.3.0"></script>
  <script src="/js/firebase_auth.js?v=2.3.0"></script>
  <script src="/js/screens/auth.js?v=2.3.0"></script>
  <script src="/js/screens/seller_dashboard.js?v=2.3.0"></script>
  <script src="/js/screens/seller_add_product.js?v=2.3.0"></script>
  <script src="/js/screens/seller_orders.js?v=2.3.0"></script>
  <script src="/js/screens/seller_profile.js?v=2.3.0"></script>
  <script src="/js/screens/buyer_marketplace.js?v=2.3.0"></script>
  <script src="/js/screens/buyer_product_details.js?v=2.3.0"></script>
  <script src="/js/screens/buyer_cart_checkout.js?v=2.3.0"></script>
  <script src="/js/screens/buyer_orders.js?v=2.3.0"></script>
  <script src="/js/screens/buyer_profile.js?v=2.3.0"></script>
  <script src="/js/app.js?v=2.3.0"></script>
</body>
</html>
